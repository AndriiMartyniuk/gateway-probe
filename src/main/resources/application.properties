spring.application.name=gateway-probe

# CoAP over TCP (coap+tcp://)
probe.lwm2m.tcp.enabled=true
probe.lwm2m.tcp.port=5683

# CoAP over TLS (coaps+tcp://), mutual TLS with X.509. Generate dev material: scripts/generate-dev-certs.sh
probe.lwm2m.tls.enabled=true
probe.lwm2m.tls.port=5684
probe.lwm2m.tls.key-store=file:certs/server.p12
probe.lwm2m.tls.key-store-password=changeit
probe.lwm2m.tls.key-alias=server
probe.lwm2m.tls.trusted-certificates=file:certs/ca.pem
probe.lwm2m.tls.x509-endpoints=dev-device-1
# also accept unlisted devices whose certificate is signed by a trusted CA and has CN = endpoint name
probe.lwm2m.tls.accept-ca-signed-devices=true

# HTTP (actuator)
server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Netty transport (per listener)
probe.lwm2m.transport.accept-threads=1
# 0 = Netty default (2 x CPUs)
probe.lwm2m.transport.io-threads=0
probe.lwm2m.transport.backlog=1024
# 0s = disabled
probe.lwm2m.transport.idle-timeout=0s
probe.lwm2m.transport.tls-handshake-timeout=10s
# SINGLE = java-coap's one dispatch thread per listener | VIRTUAL = per-connection mailbox on virtual threads
probe.lwm2m.transport.dispatch=SINGLE

# Per-session JSONL event log (experiment tooling): event-logs/events-<start>-<pid>.jsonl
probe.event-log.enabled=false
probe.event-log.directory=event-logs
probe.event-log.notifications=false

# Observations created by the server after each Register (one Observe per instance of these objects)
probe.observe.enabled=true
probe.observe.object-ids=32700
probe.observe.timeout=10s
# log every CoAP message with kind and size (high volume; single-session E1 runs)
probe.event-log.coap-messages=false

# Server-side session state: IN_MEMORY (lost with the instance) | REDIS (Leshan RedisRegistrationStore, synchronous)
# | REDIS_CACHED (in-memory primary + asynchronous Lettuce replica, loaded on start); Redis = spring.data.redis.*
probe.state.placement=IN_MEMORY
probe.state.redis.pool-size=64
probe.state.redis.key-prefix=probe:
probe.state.redis.load-on-start=true
