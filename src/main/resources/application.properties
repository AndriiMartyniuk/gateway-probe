spring.application.name=gateway-probe

# CoAP over TCP (coap+tcp://)
probe.lwm2m.tcp.enabled=true
probe.lwm2m.tcp.port=5683

# CoAP over TLS (coaps+tcp://), mutual TLS with X.509. Generate dev material: scripts/generate-dev-certs.sh
probe.lwm2m.tls.enabled=true
probe.lwm2m.tls.port=5684
probe.lwm2m.tls.key-store=file:certs/server.p12
probe.lwm2m.tls.key-store-password=changeit
probe.lwm2m.tls.key-alias=server
probe.lwm2m.tls.trusted-certificates=file:certs/ca.pem
probe.lwm2m.tls.x509-endpoints=dev-device-1

# HTTP (actuator)
server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Netty transport (per listener)
probe.lwm2m.transport.accept-threads=1
# 0 = Netty default (2 x CPUs)
probe.lwm2m.transport.io-threads=0
probe.lwm2m.transport.backlog=1024
# 0s = disabled
probe.lwm2m.transport.idle-timeout=0s
probe.lwm2m.transport.tls-handshake-timeout=10s

# Per-session JSONL event log (experiment tooling): event-logs/events-<start>-<pid>.jsonl
probe.event-log.enabled=false
probe.event-log.directory=event-logs
probe.event-log.notifications=false
